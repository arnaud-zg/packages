    expo: ^57.0.13
    react-native: ^0.86.2
  testing-library:
    "@testing-library/jest-dom": ^6.4.2
    "@testing-library/react": ^16.0.0
  vite:
    "@vitejs/plugin-react": ^4.4.1
    jsdom: ^24.1.3

onlyBuiltDependencies:
  - lefthook
