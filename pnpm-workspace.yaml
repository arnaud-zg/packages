packages:
  - packages/*

catalog:
  "@arnaud-zg/configs": 0.4.0
  "@eslint/js": ^9.39.5
  "@ianvs/prettier-plugin-sort-imports": ^4.7.1
  "@commitlint/cli": ^21.2.4
  "@commitlint/config-conventional": ^21.2.4
  eslint: ^9.39.5
  eslint-config-prettier: ^10.1.8
  lefthook: ^2.2.2
  prettier: ^3.10.1
  prettier-plugin-packagejson: ^3.1.0
  remark-cli: ^12.0.1
  remark-preset-lint-recommended: ^7.0.1
  tsdown: 0.21.10
  typescript: 6.0.3
  typescript-eslint: ^8.72.2
  vitest: ^5.1.0
  zod: 4.6.7

catalogs:
  node:
    "@types/node": ^22.20.5
  react:
    react: ^19.3.1
    react-dom: ^19.3.1
    "@types/react": ~19.3.0
  # Expo-managed dependencies: versions follow the Expo SDK compatibility matrix
