  expo:
    expo: ^58.0.25
    react-native: ^0.88.1
    "@expo/dom-webview": ^58.0.2
  testing-library:
    "@testing-library/jest-dom": ^7.0.1
    "@testing-library/react": ^16.3.3
  vite:
    "@vitejs/plugin-react": ^6.3.0
    jsdom: ^31.0.1

onlyBuiltDependencies:
  - lefthook
